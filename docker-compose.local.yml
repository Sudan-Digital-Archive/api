services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=archivist
      - POSTGRES_DB=sudan_archives
      - POSTGRES_PASSWORD=test
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./create_dev_session.sh:/create_dev_session.sh

volumes:
  postgres_data:
